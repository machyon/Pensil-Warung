[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
aws-config = "1.13.4"
aws-sdk-s3 = "1.162.0"
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.10", features = ["derive"] }
deadpool-postgres = "0.14.2"
dotenvy = "0.15.7"
image = "0.25.10"
jsonwebtoken = "12.0.0"
refinery = { version = "0.10.0", features = ["tokio-postgres"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rust_decimal = { version = "1.43.0", features = ["db-tokio-postgres", "serde-with-str"] }
rustls = "0.23.46"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_with = "3.25.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-postgres = { version = "0.7.18", features = ["with-uuid-1", "with-time-0_3", "with-serde_json-1"] }
tokio-postgres-rustls = "0.14.0"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "timeout", "limit", "request-id"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
unicode-normalization = "0.1"
uuid = { version = "1.29.3", features = ["v4", "serde"] }
webpki-roots = "1.0.12"

[dev-dependencies]
http-body-util = "0.1.5"
